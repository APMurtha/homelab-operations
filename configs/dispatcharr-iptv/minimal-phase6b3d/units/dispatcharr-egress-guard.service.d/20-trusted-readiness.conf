# Matched transition only; preserves the original base unit and firewall policy.
[Service]
RuntimeDirectory=dispatcharr-guard-status
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
ExecStartPre=
ExecStartPre=/usr/bin/python3 -B /docker/dispatcharr-iptv/provider_control.py revoke
ExecStartPre=/usr/bin/rm -f -- /run/dispatcharr-guard-status/guard.json /run/dispatcharr-guard-status/grant.json /run/dispatcharr-guard/ready
ExecStartPre=/usr/bin/python3 /docker/dispatcharr-iptv/minimal-phase6b3d/verify.py inputs
ExecStop=/usr/bin/python3 -B /docker/dispatcharr-iptv/guard.py revoke
ExecStopPost=-/usr/bin/python3 -B /docker/dispatcharr-iptv/provider_control.py revoke
ExecStopPost=-/usr/bin/rm -f -- /run/dispatcharr-guard-status/guard.json /run/dispatcharr-guard-status/grant.json /run/dispatcharr-guard/ready
ExecStopPost=/usr/bin/python3 -B /docker/dispatcharr-iptv/guard.py revoke
ExecStopPost=/usr/bin/python3 -B /docker/dispatcharr-iptv/guard.py assert-revoked
