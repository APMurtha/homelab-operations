# CANDIDATE ONLY. Install after the existing 20-resource-admission.conf.
[Service]
RuntimeDirectory=dispatcharr-permanent
RuntimeDirectoryMode=0700
ExecStartPre=
ExecStartPre=/usr/bin/rm -f -- /run/dispatcharr-guard-status/guard.json /run/dispatcharr-guard-status/grant.json /run/dispatcharr-guard/ready
ExecStartPre=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/verify.py inputs
ExecStartPre=/usr/bin/python3 -B /docker/dispatcharr-iptv/boot-admission-phase6b3k/admit.py
ExecStartPre=/usr/bin/python3 /docker/dispatcharr-iptv/guard.py apply --policy /docker/dispatcharr-iptv/private/egress-policy.json
ExecStartPre=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/lifecycle.py prepare
ExecStartPre=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/verify.py prestart
ExecStart=
ExecStart=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/lifecycle.py start
ExecStartPost=
ExecStartPost=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/verify.py running
ExecStopPost=
ExecStopPost=-/usr/bin/rm -f -- /run/dispatcharr-guard-status/guard.json /run/dispatcharr-guard-status/grant.json
ExecStopPost=/usr/bin/python3 -B /docker/dispatcharr-iptv/permanent-streaming/lifecycle.py stop
