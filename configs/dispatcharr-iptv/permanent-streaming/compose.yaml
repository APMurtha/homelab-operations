# CANDIDATE ONLY. Do not apply without installation authorization.
name: rivendell-iptv
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  iptv-vpn:
    image: qmcgaw/gluetun@sha256:a2d96492aaac1e57d91e324fcf32382fc3c4b4f1fb59997fcf7c93effc582209
    container_name: rivendell-iptv-vpn
    restart: 'no'
    privileged: false
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - NET_BIND_SERVICE
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    security_opt:
    - no-new-privileges:true
    devices:
    - /dev/net/tun:/dev/net/tun
    entrypoint:
    - /bin/sh
    - /opt/vpn-owner-gate.sh
    sysctls:
      net.ipv6.conf.all.disable_ipv6: '1'
      net.ipv6.conf.default.disable_ipv6: '1'
    environment:
      TZ: America/New_York
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_ALLOWED_IPS: 0.0.0.0/0
      WIREGUARD_MTU: '1320'
      WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL: 15s
      FIREWALL: 'on'
      FIREWALL_INPUT_PORTS: '9192'
      FIREWALL_OUTBOUND_SUBNETS: 10.10.30.0/24,10.10.20.30/32,172.20.0.0/16
      DNS_KEEP_NAMESERVER: 'off'
      DNS_UPSTREAM_RESOLVER_TYPE: dot
      VPN_PORT_FORWARDING: 'off'
    ports:
    - 10.10.20.30:9191:9192/tcp
    volumes:
    - type: bind
      source: /docker/dispatcharr-iptv/gluetun
      target: /gluetun
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/private/wg0.conf
      target: /gluetun/wireguard/wg0.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/private/egress-policy.json
      target: /opt/egress-policy.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/dispatcharr-guard
      target: /guard
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/vpn-owner-gate.sh
      target: /opt/vpn-owner-gate.sh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/vpn-post-rules.txt
      target: /iptables/post-rules.txt
      read_only: true
      bind:
        create_host_path: false
    networks:
      iptv_egress:
        ipv4_address: 172.16.70.2
    mem_limit: 256m
    pids_limit: 128
    logging: *id001
    pull_policy: never
  dispatcharr:
    image: local/dispatcharr-readiness@sha256:14c8373377b8a7244e9b49d65a364798d02e2ace405b04730dba7a149f7cad21
    container_name: dispatcharr
    restart: 'no'
    privileged: false
    network_mode: service:iptv-vpn
    depends_on:
      iptv-vpn:
        condition: service_healthy
        restart: true
    entrypoint:
    - python
    - /opt/dispatcharr-vpn-startup-gate.py
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID
    - KILL
    security_opt:
    - no-new-privileges:true
    environment:
      TZ: America/New_York
      DISPATCHARR_ENV: aio
      DISPATCHARR_PORT: '9191'
      DISPATCHARR_LOG_LEVEL: info
      DISPATCHARR_TRUSTED_PROXIES: 127.0.0.1/32
      REDIS_HOST: localhost
      CELERY_BROKER_URL: redis://localhost:6379/0
      UWSGI_WORKERS: '2'
      CELERY_MAX_WORKERS: '2'
      CELERY_MIN_WORKERS: '1'
    env_file:
    - /docker/dispatcharr-iptv/private/app.env
    volumes:
    - type: bind
      source: /docker/dispatcharr-iptv/data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/resolv.vpn.conf
      target: /etc/resolv.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/vpn-startup-gate.py
      target: /opt/dispatcharr-vpn-startup-gate.py
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/private/egress-policy.json
      target: /opt/egress-policy.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/dispatcharr-guard
      target: /guard
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/permanent-streaming
      target: /opt/permanent
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/private/permanent-registration.json
      target: /run/credentials/registration.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/dispatcharr-permanent/relay
      target: /runtime
      read_only: false
      bind:
        create_host_path: false
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    stop_grace_period: 60s
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:9191/',
        timeout=5).read(1)
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging: *id001
    pull_policy: never
  relay:
    image: local/dispatcharr-readiness@sha256:14c8373377b8a7244e9b49d65a364798d02e2ace405b04730dba7a149f7cad21
    pull_policy: never
    container_name: rivendell-iptv-relay
    restart: 'no'
    privileged: false
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    network_mode: service:iptv-vpn
    depends_on:
      iptv-vpn:
        condition: service_healthy
    entrypoint:
    - python
    - -B
    - /opt/permanent/relay_main.py
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
    - type: bind
      source: /docker/dispatcharr-iptv/permanent-streaming
      target: /opt/permanent
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/private/permanent-relay.json
      target: /run/credentials/relay.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/dispatcharr-guard-status
      target: /guard-status
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /docker/dispatcharr-iptv/resolv.vpn.conf
      target: /etc/resolv.conf
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /run/dispatcharr-permanent/relay
      target: /runtime
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /docker/jellyfin/config/iptv/permanent-dw
      target: /exports
      read_only: false
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=1000,gid=1000,mode=0700
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    stop_grace_period: 60s
    healthcheck:
      test:
      - CMD
      - python
      - -B
      - /opt/permanent/health.py
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 2
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '2'
  gateway:
    image: caddy:2-alpine@sha256:78bd35025c7ba85961dd149ae670315129954e77abe2383ac47c89106b35ade9
    container_name: rivendell-iptv-gateway
    restart: 'no'
    privileged: false
    user: 65532:65532
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    read_only: true
    network_mode: service:iptv-vpn
    depends_on:
      iptv-vpn:
        condition: service_healthy
        restart: true
      dispatcharr:
        condition: service_healthy
      relay:
        condition: service_healthy
    entrypoint:
    - caddy
    - run
    - --config
    - /etc/caddy/Caddyfile
    - --adapter
    - caddyfile
    volumes:
    - type: bind
      source: /docker/dispatcharr-iptv/permanent-streaming/Caddyfile
      target: /etc/caddy/Caddyfile
      read_only: true
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65532,gid=65532,mode=0700
    - /config:rw,nosuid,nodev,noexec,size=8m,uid=65532,gid=65532,mode=0700
    - /data:rw,nosuid,nodev,noexec,size=8m,uid=65532,gid=65532,mode=0700
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test:
      - CMD
      - /bin/busybox
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:9192/healthz
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *id001
    pull_policy: never
networks:
  iptv_egress:
    name: rivendell-iptv-egress
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-iptv-eg
    ipam:
      config:
      - subnet: 172.16.70.0/24
        gateway: 172.16.70.1
